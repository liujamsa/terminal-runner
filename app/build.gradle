plugins {
    id "com.android.application"
}

android {
    namespace "com.local.shelldeck"
    compileSdk 35

    defaultConfig {
        applicationId "com.local.shelldeck"
        minSdk 26
        targetSdk 35
        versionCode 28
        versionName "1.6.8"
        testInstrumentationRunner "com.local.shelldeck.PtySmokeInstrumentation"
    }

    buildTypes {
        release {
            debuggable false
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.recyclerview:recyclerview:1.3.0"
}
